<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ title }} &middot; Dashboard Financeiro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body class="auth-body">

  <div class="auth-wrapper">
    <div class="auth-card" style="max-width: 560px;">
      <div class="text-center mb-4">
        <i class="bi bi-person-badge auth-logo"></i>
        <h1 class="h4 mt-2 mb-0">Complete seu Perfil</h1>
        <p class="text-secondary small">Quase lá! Preencha seus dados de contratação para liberar o dashboard.</p>
      </div>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert alert-{{ category }} alert-dismissible fade show py-2" role="alert">
              {{ message }}
              <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="post" action="{{ url_for('onboarding.save') }}">
        <div class="row g-2">
          <div class="col-12">
            <label for="job_title" class="form-label">Cargo</label>
            <input type="text" class="form-control" id="job_title" name="job_title"
                   value="{{ profile.job_title or '' }}" placeholder="Ex.: Analista de Sistemas" />
          </div>
          <div class="col-md-6">
            <label for="admission_date" class="form-label">Data de Admissão</label>
            <input type="date" class="form-control" id="admission_date" name="admission_date"
                   value="{{ profile.admission_date or '' }}" />
          </div>
          <div class="col-md-6">
            <label for="contract_type" class="form-label">Tipo de Contrato</label>
            <select class="form-select" id="contract_type" name="contract_type">
              <option value="HORISTA" {% if profile.contract_type == 'HORISTA' %}selected{% endif %}>Horista</option>
              <option value="MENSALISTA" {% if profile.contract_type == 'MENSALISTA' %}selected{% endif %}>Mensalista</option>
            </select>
          </div>
          <div class="col-md-6">
            <label for="base_rate" class="form-label" id="baseRateLabel">{{ profile.label_rate }}</label>
            <input type="number" step="0.01" min="0" class="form-control" id="base_rate" name="base_rate"
                   value="{{ profile.base_rate or '' }}" placeholder="0,00" />
          </div>
          <div class="col-md-6">
            <label for="monthly_hours" class="form-label">Horas Mensais</label>
            <input type="number" step="1" min="1" class="form-control" id="monthly_hours" name="monthly_hours"
                   value="{{ profile.monthly_hours or 220 }}" />
          </div>
          <div class="col-md-6">
            <label for="irrf_dependents" class="form-label">Dependentes (IRRF)</label>
            <input type="number" step="1" min="0" class="form-control" id="irrf_dependents" name="irrf_dependents"
                   value="{{ profile.irrf_dependents or 0 }}" />
          </div>
          <div class="col-md-6">
            <label for="fixed_benefits_deduction" class="form-label">Dedução Fixa de Benefícios (R$)</label>
            <input type="number" step="0.01" min="0" class="form-control" id="fixed_benefits_deduction"
                   name="fixed_benefits_deduction" value="{{ profile.fixed_benefits_deduction or 0 }}" placeholder="0,00" />
          </div>
        </div>

        <div class="d-grid gap-2 mt-4">
          <button type="submit" class="btn btn-primary">
            <i class="bi bi-check-lg me-1"></i>Salvar e acessar o dashboard
          </button>
        </div>
      </form>

      <div class="text-center mt-3">
        <a href="{{ url_for('auth.logout') }}" class="text-secondary small"><i class="bi bi-box-arrow-right me-1"></i>Sair</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
