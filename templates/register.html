<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ title }} &middot; Dashboard Financeiro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body class="auth-body">

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="text-center mb-4">
        <i class="bi bi-person-plus auth-logo"></i>
        <h1 class="h4 mt-2 mb-0">Criar Conta</h1>
        <p class="text-secondary small">Comece a controlar seus holerites</p>
      </div>

      <!-- Mensagens flash -->
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert alert-{{ category }} alert-dismissible fade show py-2" role="alert">
              {{ message }}
              <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="post" action="{{ url_for('auth.register') }}">
        <div class="mb-3">
          <label for="name" class="form-label">Nome</label>
          <input type="text" class="form-control" id="name" name="name"
                 placeholder="Seu nome" required autofocus />
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">E-mail</label>
          <input type="email" class="form-control" id="email" name="email"
                 placeholder="voce@exemplo.com" required />
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Senha</label>
          <input type="password" class="form-control" id="password" name="password"
                 placeholder="Mínimo 6 caracteres" required />
        </div>
        <div class="mb-3">
          <label for="confirm_password" class="form-label">Confirmar senha</label>
          <input type="password" class="form-control" id="confirm_password"
                 name="confirm_password" placeholder="Repita a senha" required />
        </div>
        <button type="submit" class="btn btn-primary w-100">Cadastrar</button>
      </form>

      <p class="text-center text-secondary small mt-3 mb-0">
        Já tem conta?
        <a href="{{ url_for('auth.login') }}">Entrar</a>
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
